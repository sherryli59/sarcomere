# Build and analysis environment for the sarcomere simulator.
# Versions are those of the Sherlock env used to build and validate the
# code (2026-10-29); environment.lock.yml pins every package exactly.
#   micromamba create -n sarcomere -f environment.yml
name: sarcomere
channels:
  - conda-forge
dependencies:
  # C++ toolchain and libraries (cpp/CMakeLists.txt)
  - cmake=4.0
  - make=4.4
  - gcc=11
  - gxx=11
  - sysroot_linux-64=2.17
  - eigen=3.4
  - gsl=2.8
  - hdf5=1.14
  - jemalloc=5.3
  # Analysis, rendering and tests
  - python=3.14
  - numpy=2.4
  - scipy=1.17
  - matplotlib=3.10
  - h5py=3.15
  - ffmpeg=8.0
  - mesalib=25.3
  - ovito=3.14
  - pytest=9.0
  - ipykernel=7.1
  - pip
  - pip:
    - joblib==1.5.3
    - pypdf==6.14.2
    - pyvista==0.47.1
